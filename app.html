<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707">
<title>CUTE-S AI</title><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body>
<header><img src="icon.png" alt=""><div class="ttl">CUTE-S <b>AI</b></div><button class="ib" id="nc" title="New chat">✏️</button></header>
<main>
<section id="chat" class="view on"><div id="msgs"></div>
<div class="bar"><textarea id="q" rows="1" placeholder="Ask anything about your studies..."></textarea><button class="send" id="send" aria-label="Send">➤</button></div></section>
<section id="lib" class="view"><h3>Notes Library</h3><input id="s" placeholder="🔍 Search title, subject, university"><div class="row"><input id="fu" placeholder="University"><input id="fs" placeholder="Subject"></div><button class="pb" id="ld">Search</button><div id="list"></div></section>
<section id="up" class="view"><h3>Share your notes</h3><input id="t" maxlength="100" placeholder="Title"><div class="row"><input id="u" maxlength="60" placeholder="University"><input id="sb" maxlength="60" placeholder="Subject"></div>
<textarea class="f" id="tx" rows="7" maxlength="20000" placeholder="Notes text (optional if you attach a file)"></textarea><input id="f" type="file" accept="application/pdf,image/*">
<label class="ck"><input type="checkbox" id="ok"><span>These are my own notes, or I have the right to share them. No copyrighted books.</span></label><p class="err" id="ue"></p><button class="pb" id="pub">Publish (free)</button></section>
<section id="me" class="view pf"><h3 id="who"></h3><p><a href="privacy.html">Privacy Policy & Terms</a></p><p>Contact: moonstar7023@gmail.com</p><p>Developer: iTz×͜Shahmir</p><p>💗 CUTE-S AI is free for all studies.</p><button class="pb" id="out">Logout</button></section>
</main>
<nav><button class="on" data-v="chat"><span>🤖</span>AI</button><button data-v="lib"><span>📚</span>Notes</button><button data-v="up"><span>⬆️</span>Upload</button><button data-v="me"><span>👤</span>Me</button></nav>

<script src="https://www.gstatic.com/firebase10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebase10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebase10.12.2/firebase-storage-compat.js"></script>
<script src="https://js.puter.com/v2/"></script><script src="firebase-config.js"></script><script src="app.js"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script></body></html>
