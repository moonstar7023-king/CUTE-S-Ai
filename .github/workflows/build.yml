name: Build Cute-S AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: mkdir -p www && cp index.html logo.png www/
      - run: npm install -g cordova@12
      - run: cordova platform add android@13.0.0
      - run: cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Cute-S-AI-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
